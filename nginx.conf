server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- API do Backend-Sonda (mesma origem -> sem CORS) ----
    location /api/        { proxy_pass http://backend-sonda:8080; }
    location /auth/       { proxy_pass http://backend-sonda:8080; }
    location /usuarios/   { proxy_pass http://backend-sonda:8080; }
    location /swagger-ui  { proxy_pass http://backend-sonda:8080; }
    location /v3/         { proxy_pass http://backend-sonda:8080; }

    # ---- API de telemetria (series do InfluxDB) ----
    # front chama /telemetria/api/monitoramentos/... -> telemetria:8081/api/monitoramentos/...
    location /telemetria/ { proxy_pass http://telemetria:8081/; }

    # ---- index.html nunca em cache: garante que cada deploy novo seja carregado ----
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ---- assets com hash no nome podem ser cacheados por muito tempo ----
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA: rotas do Angular caem no index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
